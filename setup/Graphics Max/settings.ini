; Maximum graphics (for a modern graphics card). Applied by "Graphics - Max.bat".
; On an NVIDIA RTX card the bat also applies nvidia-rtx.ini (DLSS instead of FSR 3).
; Values match the game's Options > Graphics menu; edit any line to taste.
; Advanced: Direct3D 12, FSR 3 at Native AA, no frame generation (adds aim delay), pose smoothing on
renderer=2
temporal_upscaler=3
temporal_quality=3
frame_generation=0
render_interpolation=1
ray_shadows=1
; Resolution: match the window (the upscaler handles anti-aliasing), no dynamic resolution
resolution_mode=1
render=4
dynamic_resolution=0
downsample=1
; Image: AA comes from the upscaler; 16x anisotropic, linear filtering, sharp HUD, low sharpening
msaa=1
post_aa=0
temporal_aa=0
alpha_coverage=0
anisotropy=16
texture_filter=2
output_resolution_hud=1
sharpening=1
; Lighting (0 Off, 1 Low, 2 Medium, 3 High; shadows 1=1024 2=2048 3=4096)
per_pixel_lighting=1
soft_particles=3
ambient_occlusion=3
shadow_maps=3
reflections=3
volumetric_fog=1
bloom=1
cinematic_focus=1
; Packs: material detail / model smoothing (used only if the loaded pack has them)
material_maps=1
mesh_refinement=3
