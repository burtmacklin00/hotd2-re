; lightgunHID.ini - which light gun is Player 1 and which is Player 2
;
; Guns are matched by hardware ID, so this file works on any PC with the same guns.
; 1. Start the game once with your guns plugged in, then close it.
; 2. Open lightgunHID_devices.txt (in this folder). It lists every connected
;    mouse-type device with its VID/PID and name.
; 3. Copy your guns' VID_xxxx&PID_xxxx into Device= below (remove the ; in front).
;    If one gun shows several lines, add the &MI_xx part to pick the right one.
;
; Behaviour:
;   - One or both guns connected: light-gun mode, 2 players, each gun its own player.
;   - No configured gun connected: 1 player with the mouse (if MouseFallback=1).
;   - Guns plugged in or unplugged while the game runs are picked up within 2 seconds.
; Buttons and aim calibration are still set per player in Options > Light Guns.
;
; Device= also accepts the short form 16C0:0F01.
; Two identical guns (same VID/PID)? Use the same Device= for both; Player 2 gets the
; second one. Swap them with Index=2 under Player1 and Index=1 under Player2.

[Player1]
;Device=VID_16C0&PID_0F01

[Player2]
;Device=VID_16C0&PID_0F02

[Options]
MouseFallback=1
