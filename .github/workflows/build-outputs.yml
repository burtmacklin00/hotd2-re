# Builds the HOTD2RE outputs / lightgunHID package with Visual Studio 2022:
#   hotd2-outputs64.exe  64-bit, Direct3D 12, DLSS + FSR + XeSS + DXC ray shadows (vendor SDKs at the pinned
#                        versions in notes/agents/night-shift-integration.md)
#   hotd2-outputs.exe    32-bit
# plus the setup files (launchers, bezel, lightgunHID.ini, Hook of the Reaper file). The package has no original
# game data: extract it into an existing hotd2re folder (next to game/ and scenes/).
# Runs on demand (Actions > Build outputs package > Run workflow) and publishes a GitHub release when a tag
# starting with "outputs-" is pushed. Ordinary pushes do not build. sync-official.yml also calls it (with a ref and
# a release tag) after merging a new official release.
name: Build outputs package

on:
  push:
    tags: ['outputs-*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: commit to build
        type: string
        required: true
      release_tag:
        description: publish a release with this tag
        type: string
        required: true

permissions:
  contents: write

env:
  FSR_COMMIT: 60f4ea81909200d8542eca14dccb2628b763a9a3
  XESS_COMMIT: de0fb9c1c510661c571164e1418ceca8101dab69
  DLSS_COMMIT: 9981c6350dc58c0ce21f024fd65e31e851c31689
  DXC_TAG: v1.9.2609
  DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Fetch vendor SDKs (pinned)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = "$env:RUNNER_TEMP\sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          function Fetch($dir, $url, $commit) {
            git init -q "$sdk\$dir"
            git -C "$sdk\$dir" fetch -q --depth 1 $url $commit
            git -C "$sdk\$dir" checkout -q FETCH_HEAD
            if ((git -C "$sdk\$dir" rev-parse HEAD) -ne $commit) { throw "$dir is not at $commit" }
          }
          Fetch fidelityfx https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git $env:FSR_COMMIT
          Fetch xess https://github.com/intel/xess.git $env:XESS_COMMIT
          Fetch dlss https://github.com/NVIDIA/DLSS.git $env:DLSS_COMMIT
          # DXC: the official Windows release zip, verified against the hash the project records.
          gh release download $env:DXC_TAG -R microsoft/DirectXShaderCompiler -p 'dxc_*.zip' -D "$sdk\dxc-zip"
          $zip = Get-ChildItem "$sdk\dxc-zip\dxc_*.zip" | Where-Object { $_.Name -notmatch 'pdb' } | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:DXC_SHA256) { throw "DXC zip $($zip.Name) hash $hash does not match" }
          Expand-Archive $zip.FullName -DestinationPath "$sdk\dxc"
          "SDK=$sdk" >> $env:GITHUB_ENV

      - name: Build 64-bit
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -A x64 -DHOTD2_ALLOW_64BIT=ON `
            -DHOTD2_DLSS_SDK="$env:SDK\dlss" -DHOTD2_FSR_SDK="$env:SDK\fidelityfx" `
            -DHOTD2_XESS_SDK="$env:SDK\xess" -DHOTD2_DXC_SDK="$env:SDK\dxc"
          cmake --build build-x64 --config Release --target hotd2 --parallel

      - name: Build 32-bit
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32
          cmake --build build --config Release --target hotd2 --parallel

      - name: Build LightgunSetup.exe
        shell: pwsh
        run: |
          cmake -S tools/lightgun_setup -B build-setup -A Win32
          cmake --build build-setup --config Release

      - name: Compile Play HOTD2.exe (AutoHotkey 1.1.37.02)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip -OutFile ahk.zip
          if ((Get-FileHash ahk.zip -Algorithm SHA256).Hash -ne '6F3663F7CDD25063C8C8728F5D9B07813CED8780522FD1F124BA539E2854215F') { throw 'AutoHotkey zip hash mismatch' }
          Expand-Archive ahk.zip -DestinationPath ahk
          Copy-Item 'ahk\Compiler\Unicode 32-bit.bin' base32.bin
          $a = @('/in', '"setup\Play HOTD2.ahk"', '/out', 'PlayHOTD2.exe', '/base', 'base32.bin', '/silent')
          if (Test-Path 'build-x64\src\port\hotd2.ico') { $a += @('/icon', 'build-x64\src\port\hotd2.ico') }
          Start-Process -Wait -FilePath 'ahk\Compiler\Ahk2Exe.exe' -ArgumentList $a
          if (-not (Test-Path PlayHOTD2.exe)) { throw 'Ahk2Exe did not produce PlayHOTD2.exe' }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "package\hotd2re"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item setup\* $out -Recurse -Force
          $x64 = 'build-x64\src\port\Release'
          Copy-Item "$x64\hotd2.exe" "$out\hotd2-outputs64.exe"
          foreach ($f in 'nvngx_dlss.dll','nvngx_dlssg.dll','amd_fidelityfx_upscaler_dx12.dll',
                         'amd_fidelityfx_framegeneration_dx12.dll','libxess.dll','dxcompiler.dll','dxil.dll') {
            Copy-Item "$x64\$f" $out
          }
          foreach ($d in 'vendor-licenses','dxc-licenses') { if (Test-Path "$x64\$d") { Copy-Item "$x64\$d" $out -Recurse -Force } }
          Copy-Item 'build\src\port\Release\hotd2.exe' "$out\hotd2-outputs.exe"
          Copy-Item 'build-setup\Release\LightgunSetup.exe' $out
          Copy-Item PlayHOTD2.exe "$out\Play HOTD2.exe"
          Copy-Item LICENSE "$out\LICENSE-native-code.txt"
          Copy-Item THIRD_PARTY_NOTICES.txt $out
          $sha = git rev-parse HEAD
          $tag = '${{ inputs.release_tag }}'
          if (-not $tag -and '${{ github.ref_type }}' -eq 'tag') { $tag = '${{ github.ref_name }}' }
          if (-not $tag) { $tag = 'dev-' + $sha.Substring(0, 7) }
          $tag | Set-Content "$out\VERSION.txt"
          "Built from $sha by GitHub Actions run $env:GITHUB_RUN_ID" | Set-Content "$out\BUILD-OUTPUTS.txt"
          Compress-Archive -Path $out -DestinationPath hotd2re-outputs-package.zip
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: hotd2re-outputs-package
          path: package/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/outputs-') || inputs.release_tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $notes = "Unofficial HOTD2RE Light Gun Edition: game outputs (hod2re), lightgunHID.ini, launcher with bezel, DLSS/FSR/XeSS.`n`n" +
                   "New install: extract into an existing hotd2re folder (next to game\ and scenes\).`n" +
                   "Already installed: run ""Update HOTD2.bat"" (your settings, gun setup, saves and bezel are kept)."
          gh release create $tag hotd2re-outputs-package.zip --target (git rev-parse HEAD) --title "HOTD2RE Light Gun Edition $tag" --notes $notes
